<script>
  // ===== CSV 로드 + 탭별 렌더 =====
  const LIST_IDS = {
    skt: "list-skt",
    kt: "list-kt",
    lg: "list-lg",
    internet: "list-internet",
    mvno: "list-mvno",
  };

  // CSV 한 줄 파싱(따옴표 포함 대응)
  function parseCSV(text) {
    const rows = [];
    const lines = text.replace(/\r/g, "").split("\n").filter(l => l.trim().length);
    for (const line of lines) {
      const out = [];
      let cur = "", inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (ch === "," && !inQ) {
          out.push(cur.trim()); cur = "";
        } else {
          cur += ch;
        }
      }
      out.push(cur.trim());
      rows.push(out);
    }
    return rows;
  }

  function escapeHtml(s="") {
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // 카드 UI (필요하면 네 기존 카드 디자인으로 바꿔도 됨)
  function cardHTML(item) {
    // 기대 컬럼 예시: 통신사,기종,요금제,현금지원,월요금,비고
    const model = item["기종"] || item["모델"] || item["상품명"] || "";
    const plan  = item["요금제"] || item["요금"] || "";
    const cash  = item["현금지원"] || item["지원금"] || item["현금"] || "";
    const fee   = item["월요금"] || item["월 요금"] || "";
    const note  = item["비고"] || item["메모"] || "";

    return `
      <div style="
        border:1px solid rgba(15,23,42,0.10);
        border-radius:18px;
        padding:14px 14px;
        margin:10px 0;
        background:#fff;
        box-shadow:0 12px 22px rgba(15,23,42,0.06);
      ">
        <div style="font-weight:1000;font-size:16px">${escapeHtml(model)}</div>
        <div style="margin-top:6px;color:#334155;font-weight:800;font-size:13px">
          ${escapeHtml(plan)}
        </div>
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
          ${cash ? `<span style="padding:6px 10px;border-radius:999px;background:#e0f2fe;font-weight:1000">현금 ${escapeHtml(cash)}</span>` : ``}
          ${fee  ? `<span style="padding:6px 10px;border-radius:999px;background:#dcfce7;font-weight:1000">월 ${escapeHtml(fee)}</span>` : ``}
        </div>
        ${note ? `<div style="margin-top:10px;color:#475569;font-size:13px;font-weight:700">${escapeHtml(note)}</div>` : ``}
      </div>
    `;
  }

  function renderTo(tabKey, items) {
    const el = document.getElementById(LIST_IDS[tabKey]);
    if (!el) return;

    if (!items.length) {
      el.innerHTML = `<p style="color:#64748b;font-weight:900;margin:14px 2px">등록된 특판이 없습니다.</p>`;
      return;
    }
    el.innerHTML = items.map(cardHTML).join("");
  }

  async function loadAndRender() {
    try {
      // 중요: 상대경로 고정
      const res = await fetch("./data.csv", { cache: "no-store" });
      if (!res.ok) throw new Error("data.csv 로드 실패: " + res.status);

      const csvText = await res.text();
      const rows = parseCSV(csvText);
      if (rows.length < 2) throw new Error("CSV 데이터가 비어있음");

      const headers = rows[0].map(h => h.trim());
      const data = rows.slice(1).map(cols => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = (cols[i] ?? "").trim());
        return obj;
      });

      // 통신사/구분 컬럼 자동 탐지
      const keyField =
        (headers.find(h => ["탭","구분","카테고리","통신사"].includes(h)) || "통신사");

      const norm = (v="") => String(v).replace(/\s/g,"").toUpperCase();

      const skt = data.filter(d => ["SKT","SK"].includes(norm(d[keyField])));
      const kt  = data.filter(d => ["KT"].includes(norm(d[keyField])));
      const lg  = data.filter(d => ["LGU+","LGU","LG"].includes(norm(d[keyField])));
      const internet = data.filter(d => ["인터넷TV","인터넷·TV","INTERNET","IPTV","인터넷"].includes(norm(d[keyField])));
      const mvno = data.filter(d => ["알뜰요금","알뜰","MVNO"].includes(norm(d[keyField])));

      renderTo("skt", skt);
      renderTo("kt", kt);
      renderTo("lg", lg);
      renderTo("internet", internet);
      renderTo("mvno", mvno);
    } catch (e) {
      console.error(e);
      // 에러가 나도 사용자 화면에 표시
      Object.values(LIST_IDS).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = `<p style="color:#ef4444;font-weight:1000">데이터를 불러오지 못했습니다. (data.csv 확인)</p>`;
      });
    }
  }

  document.addEventListener("DOMContentLoaded", loadAndRender);
</script>
